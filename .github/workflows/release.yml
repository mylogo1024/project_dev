name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      ELECTRON_BUILDER_SKIP_RELEASE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: dist-app/*
          if-no-files-found: error

  build-win:
    name: Build Windows
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_SKIP_RELEASE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: dist-app/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      ELECTRON_BUILDER_SKIP_RELEASE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-app/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-mac
      - build-win
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Read version and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Publishing release ${TAG}"
          echo "--- Artifacts layout ---"
          find releases -type f | sort || true
          # 把 3 个平台产物直接平铺到 dist-files/
          mkdir -p dist-files
          for d in releases/release-mac releases/release-win releases/release-linux; do
            if [[ -d "$d" ]]; then
              cp -f "$d"/* dist-files/ 2>/dev/null || true
            fi
          done
          echo "--- dist-files ---"
          ls -la dist-files/
          if [[ -z "$(ls -A dist-files 2>/dev/null)" ]]; then
            echo "::error::No release artifacts found. Check build jobs succeeded and artifacts uploaded."
            exit 1
          fi
          # 删除旧 release（忽略不存在的情况）
          gh release delete "$TAG" --force -y 2>/dev/null || true
          # 创建 release
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $(find dist-files -type f | sort)

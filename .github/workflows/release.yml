name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      ELECTRON_BUILDER_SKIP_RELEASE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: dist-app/*
          if-no-files-found: error

  build-win:
    name: Build Windows
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_SKIP_RELEASE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: dist-app/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      ELECTRON_BUILDER_SKIP_RELEASE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-app/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-mac
      - build-win
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Read version and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Publishing release ${TAG}"

          # 把 3 个平台产物平铺到 dist-files/（文件名含空格也能正确处理）
          mkdir -p dist-files
          for d in releases/release-mac releases/release-win releases/release-linux; do
            if [ -d "$d" ]; then
              cp -f "$d"/* dist-files/ 2>/dev/null || true
            fi
          done

          echo "--- files to upload ---"
          ls -la dist-files/

          # 删除同名旧 release（不存在则忽略）
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true

          # 用 glob 展开上传，避免文件名空格被 shell 拆分
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist-files/*
